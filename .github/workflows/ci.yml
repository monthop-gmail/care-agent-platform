name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # sqlite = เร็ว ใช้ระหว่างพัฒนา · postgres = ตรงกับ production ที่รันด้วย docker compose
        db: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: care_test
          # superuser สำหรับ bootstrap เท่านั้น — เทสต่อด้วย role `care` ที่สร้างทีหลัง
          # ให้ตรงกับ production ไม่งั้น CI ไม่ได้ทดสอบสิ่งที่ deploy จริง (care-agent-platform#1)
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d care_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 🔒 migration/payload/rls check เริ่มด้วย DROP SCHEMA — ต้องมีเจตนาชัดเจนเสมอ
      #    DB ของ CI ทิ้งได้ · deployment จริงไม่ตั้งตัวนี้ สคริปต์จึงปฏิเสธเองที่นั่น
      CONFORMANCE_ALLOW_DESTRUCTIVE: "1"
      PSTACK_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+asyncpg://care:care@localhost:5432/care_test' || 'sqlite+aiosqlite:///./test_care.db' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone pstack (pinned ref)
        run: |
          PSTACK_REF=$(grep '^PSTACK_REF=' .env.example | cut -d= -f2)
          echo "pinning pstack @ $PSTACK_REF"
          git clone --depth 1 --branch "$PSTACK_REF" \
            https://github.com/willpower-institute/pstack.git pstack_src

      - name: Install
        run: |
          pip install -e "./pstack_src[dev]"
          pip install -r requirements-dev.txt

      # service container ของ GitHub Actions mount init script ไม่ได้ จึงสร้าง role ตรงนี้แทน
      # ให้ตรงกับ deploy/db-init/10-app-role.sh ที่ production ใช้
      - name: สร้าง role แอปแบบ NOSUPERUSER ให้ตรงกับ production
        if: matrix.db == 'postgres'
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d care_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE care LOGIN PASSWORD 'care' NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB;
          ALTER DATABASE care_test OWNER TO care;
          ALTER SCHEMA public OWNER TO care;
          GRANT ALL ON SCHEMA public TO care;
          SQL

      # ต้องมาก่อนทุก step ที่แตะ DB — ถ้า role ผิด ผลของ step อื่นเชื่อไม่ได้
      - name: Role ที่แอปใช้ต้องไม่ใช่ superuser
        run: python conformance/db_role_check.py

      - name: Lint
        if: matrix.db == 'sqlite'
        run: ruff check care_addons/ tests/ conformance/ examples/

      - name: Contract conformance (agent-platform)
        if: matrix.db == 'sqlite'
        run: python conformance/drift_check.py

      - name: Migration ตรงกับ models
        run: python conformance/migration_check.py

      - name: Payload conformance (agent-platform)
        run: python conformance/payload_check.py

      # ด่านที่สอง — พิสูจน์ว่า RLS กันข้าม tenant ได้จริงโดยไม่พึ่ง scoped()
      # (เทสปกติพิสูจน์ไม่ได้ เพราะทุก query ผ่าน scoped() อยู่แล้ว)
      - name: RLS isolation (Postgres)
        if: matrix.db == 'postgres'
        run: python conformance/rls_check.py

      - name: Test
        run: pytest tests/ -q
