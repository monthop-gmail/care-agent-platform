# $schema: agent-platform contracts/profile/v1/profile.schema.yaml
# profile เป็น "เพดาน" ไม่ใช่ "การอนุญาต" — สิทธิ์จริงคือส่วนที่ profile, agent และ policy
# ของ tenant ตกลงตรงกันทั้งสามฝ่าย

profile_id: care-agent
display_name: Care Agent
description: >-
  ผู้ช่วยความจำและการดูแลผู้ป่วย — จำ เตือน บันทึก เตรียมตัว ส่งต่อ
  ความเสี่ยงหลักไม่ใช่การทำลายข้อมูล แต่คือ **การทำให้ข้อมูลที่ไม่ยืนยันกลายเป็นคำสั่งทางการแพทย์**

capability_requirement:
  required:
    - long_context
  constraints:
    max_cost_usd: 0.5

# 🔒 ชื่อในสองรายการนี้คือ **capability เดียวกับที่โค้ดประกาศ** (`@care_action`)
#    ไม่ใช่ชื่อสมมุติ — `ap_policy` โหลดไฟล์นี้จริงตอน evaluate ทุกครั้ง
#    ถ้าตั้งชื่อไม่ตรงกับที่โค้ดใช้ ไฟล์นี้จะกลายเป็นเอกสารที่ไม่มีผล ซึ่งอันตรายกว่าไม่มีเลย
tools:
  allow:
    # สิ่งที่ agent ทำเองได้ถ้า policy ของ tenant อนุญาต — เพดาน ไม่ใช่การอนุญาต
    - orientation.brief.send
    - orientation.answer
    - routine.reminder.send
    - meal.reminder.send
    - medication.reminder.send
    - appointment.reminder.send
    - appointment.prep.write
    - journal.entry.write
    - question.entry.write
    - medication.regimen.propose      # เสนอได้ — ทำให้มีผลไม่ได้ (ADR-0006)
    - careplan.task.write             # จดคำสั่งหมอได้ — ทำให้ active ไม่ได้
    - activity.step.record
    - inventory.item.write
    - home.item.write
    - safety.signal.intake
    - caregiver.notify
    - emergency.escalate
  deny:
    # 🔒 ไม่มีทางที่ agent จะทำสิ่งเหล่านี้ได้ ต่อให้ policy ของ tenant เผลอเปิด
    #    deny ชนะ allow เสมอ และชนะ authority_map ด้วย (profile/v1)
    - medication.regimen.write
    - medication.regimen.stop
    - careplan.task.activate
    - care.profile.update             # เปิด/ปิดความสามารถของผู้ป่วยเป็นการตัดสินใจของคน
    - clinical.export
    # ชื่อที่ต้องไม่มีวันมีอยู่จริงในโค้ด — ถ้าวันหนึ่งมีใครประกาศ capability ชื่อนี้
    # มันจะถูกปฏิเสธตั้งแต่วินาทีแรกโดยไม่ต้องรอให้ใครสังเกตเห็นใน review
    - diagnosis.any
    - consent.grant
    - fs.file.write
    - shell.execute

execution:
  preferred_mode: any
  min_observability_depth: step    # โดเมนนี้ต้อง audit ละเอียดถึงระดับ step
  max_duration_seconds: 60
  max_attempts: 2

policy:
  authority_map:
    low: auto
    medium: notify
    high: approval_required
    critical: human_command_required
  deny_capabilities:
    - shell
    - code_execution
    - filesystem
    - network_egress
    - autonomous_execution
  # tool ที่ต้องให้คนสั่งเสมอ ไม่ว่า action_risk จะเป็นเท่าไร — ยกพื้นเหนือ authority_map
  require_human_for:
    - medication.regimen.write
    - medication.regimen.stop

budget:
  max_cost_usd_per_execution: 0.5
  max_cost_usd_per_day: 50.0

delegation:
  enabled: false

artifact_retention_days: 365
