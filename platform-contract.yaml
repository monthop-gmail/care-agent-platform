# Consumer manifest — ประกาศว่า repo นี้ยึด contract อะไรของ agent-platform
#
# รูปแบบตาม ADR-0006 ของ agent-platform:
#   https://github.com/monthop-gmail/agent-platform/blob/main/decisions/0006-contract-versioning.md
# commit ของ contract ที่ pin ไว้ และรายการ $ref ที่อนุญาต:
#   conformance/pinned.yaml

platform_contract_version: "0.1"

contracts:
  - identity/v1     # tenant · workspace · principal — ap_tenancy ทั้งโมดูลสร้างบน $defs ชุดนี้
  - event/v1        # audit event ทุกตัวของระบบ (ap_audit) · care event เป็นส่วนขยาย ไม่ใช่ของแทน
  - policy/v1       # action_risk × authority_map → authority (ap_policy)
  - capability/v1   # ActionRisk — ผูกกับ capability ไม่ใช่กับ request
  - error/v1        # error ใน audit event เป็น object ตาม taxonomy นี้ ไม่ใช่ข้อความอิสระ
  - consent/v1      # ความยินยอมเข้าถึงข้อมูลของบุคคล (ap_tenancy) — เสนอโดย repo นี้เอง (ADR-0012)

# contract ที่ยังไม่ได้ใช้ — จะเพิ่มเมื่อ implement จริง ไม่ประกาศล่วงหน้า
not_yet:
  - approval/v1     # รอ ap_approval (M3) — ตอนนี้ action ที่ต้องมีคนสั่งถูกกั้นด้วย policy อย่างเดียว
  - execution/v1    # ยังไม่มี agent runtime ที่ผลิต execution record
  - tool/v1         # tool ของ LLM ยังไม่ได้เปิดให้ผู้ป่วยใช้ (ADR-0008)

conformance:
  status: passing
  last_verified: "2026-08-19"

  # ครบ 3 ข้อของ ADR-0006:
  #   1. manifest            — ไฟล์นี้
  #   2. conformance test    — conformance/payload_check.py รัน scenario จริงแล้ว validate
  #                            payload ที่ระบบผลิตออกมาจริง (58 audit event + policy decision)
  #                            กับ JSON Schema ที่ commit ที่ pin ไว้ · ไม่ใช่แค่ตรวจว่า $ref ถูกที่
  #                            (ตัวนั้นคือ conformance/drift_check.py ซึ่งรันคู่กัน)
  #   3. release gate        — ทั้งสองตัวเป็น step ใน .github/workflows/ci.yml ที่รันทุก PR
  #                            และทุก push เข้า main · CI ไม่ผ่าน = merge ไม่ได้

  checks:
    - name: drift_check
      command: python conformance/drift_check.py
      scope: contract ของ repo นี้ยัง $ref ตรงกับ agent-platform ที่ pin ไว้
    - name: payload_check
      command: python conformance/payload_check.py
      scope: >-
        payload จริงที่ระบบผลิต validate ผ่าน event/v1 · policy/v1 · error/v1 · consent/v1
        (audit event + consent grant ทั้งใบที่ยังใช้ได้และใบที่ถูกเพิกถอน)

# ส่วนขยายที่ repo นี้นิยามเองในโดเมนของตัวเอง — ไม่ได้ขอให้ platform รับไปดูแล
extensions:
  - id: care-event/v1
    path: contracts/event/v1/care-event.schema.yaml
    extends: event/v1
    detail: >-
      เพิ่ม care_event_type (additive ตาม RFC-0009) · patient_id · severity · evidence
      โดยไม่ลดทอน guarantee ใดของ event/v1 · payload_check validate ทั้งสองชั้น

# ช่องว่างที่เจอจากการ implement จริง
gaps: []

resolved_gaps:
  - id: subject-type-for-domain-records
    detail: SubjectType ไม่มีค่าสำหรับบันทึกของโดเมน — เคย map เป็น artifact ซึ่งความหมายเพี้ยน
    tracked_by: https://github.com/monthop-gmail/agent-platform/issues/14
    resolved_by: event/v1 เพิ่มค่า `record` (8f7dd13) — repo นี้ย้ายมาใช้แล้ว
  - id: no-consent-contract
    detail: >-
      ไม่มี contract สำหรับความยินยอมเข้าถึงข้อมูลของบุคคล ซึ่ง RBAC ตอบแทนไม่ได้
      (ทำ action ได้ ≠ ทำกับข้อมูลของคนนี้ได้)
    tracked_by: https://github.com/monthop-gmail/agent-platform/issues/15
    resolved_by: >-
      ADR-0012 + contracts/consent/v1 (5977dd9) — repo นี้ปรับ implementation ตามครบ
      รวมถึงลบ field `status` ที่ contract ห้ามไว้
