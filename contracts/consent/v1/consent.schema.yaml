$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.care-agent-platform.internal/consent/v1/care-consent.schema.yaml
title: Care Consent Scopes
description: >-
  **โครงของ consent เป็นของ `agent-platform` แล้ว** ตั้งแต่ ADR-0012 —
  ไฟล์นี้เหลือแค่ *vocabulary ของ scope* ในโดเมนนี้ ซึ่ง platform กำหนดไว้ว่าเป็นของโดเมน

  เดิมไฟล์นี้เคยนิยามทั้ง grant เอง (ตอนที่ platform ยังไม่มี consent contract)
  หลัง [agent-platform#15](https://github.com/monthop-gmail/agent-platform/issues/15)
  ถูกรับเข้าเป็น `consent/v1` เราจึงลบโครงที่ซ้ำออกและ `$ref` ไปที่ต้นทางแทน
  ตามกติกาใน ADR-0001 ที่ห้ามนิยามสิ่งที่ platform นิยามแล้วซ้ำ

extends:
  $ref: https://schemas.agent-platform.internal/consent/v1/consent.schema.yaml

$defs:
  CareScope:
    description: >-
      scope ของโดเมนนี้ — **แยกตามความอ่อนไหว ไม่ใช่ก้อนเดียว**
      `location` และ `clinical` เป็นคนละชั้นกับ `routine` · ครอบครัวส่วนใหญ่ควรได้แค่ชุดแรก

      🔒 consumer ที่เจอ scope ที่ไม่รู้จักต้องถือว่า **ไม่ได้รับอนุญาต** ไม่ใช่อนุญาต
      (platform_rules ของ consent/v1)
    enum:
      - routine.read
      - meal.read
      - medication.read
      - appointment.read
      - journal.read
      - location.read
      - clinical.read
      - care.manage

  CarePurpose:
    description: >-
      หนึ่ง grant = หนึ่งวัตถุประสงค์ · ถ้ามีหลายวัตถุประสงค์ให้แยกใบ
      เพราะ purpose ที่กว้างคือวิธีที่ consent กลายเป็นใบเบิกทางทุกอย่าง
    enum: [daily_care, clinical_care, emergency, family_awareness]

care_consent_rules:
  description: ข้อกำหนดของโดเมนที่เพิ่มจาก `consent_rules` ของ platform (ไม่ลดทอนข้อใด)
  rules:
    - "ผู้ให้ความยินยอมที่ไม่ใช่เจ้าของข้อมูล **ต้องระบุ authority_basis เสมอ**
       — platform ให้เป็น optional แต่ในโดเมนนี้การให้แทนคือกรณีปกติ ไม่ใช่ข้อยกเว้น"
    - "ข้อยกเว้นฉุกเฉินใช้ได้เฉพาะ severity critical และต้องแจ้งเจ้าของข้อมูลย้อนหลังเสมอ (ADR-0007)"
    - "default ของ grant ใหม่คือไม่ได้อะไรเลย — ต้องเลือกทีละ scope"
